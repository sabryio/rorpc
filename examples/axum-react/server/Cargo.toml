[package]
name = "orpc-rust"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "server"
path = "src/main.rs"

[[bin]]
name = "inspector"
path = "src/bin/inspector.rs"

[features]
default = []
better-auth-integration = ["dep:better-auth", "dep:sea-orm"]

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.19"
async-stream = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.5"
tower-http = { version = "0.7.1", features = ["cors"] }
futures = "0.3"
better-auth = { version = "1.0.0-alpha.2", features = ["axum", "seaorm2"], optional = true }
sea-orm = { version = "2.0.0-rc.37", default-features = false, features = [
    "sqlx-sqlite",
    "runtime-tokio",
    "macros",
    "with-chrono",
    "with-json",
    "with-uuid",
], optional = true }

# Utilities
chrono = "0.4"
colored = "3.1.1"
