[package]
name = "better-auth-rorpc-example"
version = "0.1.0"
edition = "2021"

[package.metadata.rorpc]
client_path = "../client/src/rpc/bindings.ts"

[features]
default = []
better-auth-integration = ["dep:better-auth"]

[dependencies]
# Core
tokio = { version = "1.53", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Web framework
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors"] }

# rorpc
rorpc = { workspace = true }

# Better Auth RS (using alpha version) - optional feature
better-auth = { version = "1.0.0-alpha.2", features = ["axum", "seaorm2"], optional = true }

# Utilities
chrono = "0.4"

async-trait = "0.1.92"
tokio-stream = "0.1.19"
async-stream = "0.3"
futures = "0.3"
