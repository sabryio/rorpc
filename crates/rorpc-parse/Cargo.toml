[package]
name = "rorpc-parse"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "AST parsing utilities and code generation internals for rorpc proc macros"
documentation = "https://docs.rs/rorpc-parse"
readme = "README.md"
keywords = ["rpc", "axum", "codegen", "typescript", "proc-macro"]
categories = ["development-tools::procedural-macro-helpers", "web-programming"]
include = ["src/**/*", "README.md", "Cargo.toml"]

[dependencies]
syn = { workspace = true, features = ["extra-traits"] }
quote = { workspace = true }
proc-macro2 = { workspace = true }
inventory = { workspace = true }
toml = "1.1.5"
