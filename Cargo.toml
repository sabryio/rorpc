[workspace]
members = [
    "crates/rorpc",
    "crates/rorpc-macros",
    "crates/rorpc-parse",
    "examples/axum-react/server",
    "examples/axum-react/better-auth-integration",
]
# Examples are excluded from publishing — they are not crates.io packages
exclude = ["examples/*"]
resolver = "3"

[workspace.package]
version = "0.1.6"
edition = "2024"
authors = ["Sabry Awad <dr.sabry1997@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/sabryio/rorpc"
homepage = "https://github.com/sabryio/rorpc"

[workspace.dependencies]
# Internal crates
rorpc = { path = "crates/rorpc", version = "0.1.6" }
rorpc-macros = { path = "crates/rorpc-macros", version = "0.1.6" }
rorpc-parse = { path = "crates/rorpc-parse", version = "0.1.6" }

# Proc-macro toolchain
syn = { version = "3.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"

# Runtime
inventory = "0.3"
axum = { version = "0.8", features = ["macros"] }
serde = { version = "1.0", features = ["derive"] }
